name: PWA CI

on:
  push:
    branches: [main, "feat/independent-pwa-login-panels"]
    paths:
      - "pwa/**"
      - ".github/workflows/pwa-ci.yml"
  pull_request:
    paths:
      - "pwa/**"
      - ".github/workflows/pwa-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build PWA
        run: npm run build