name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: npm run build
      - name: Pricing, custody-release, and SQLite settlement regression tests
        run: node --test test/pricing-service.test.cjs test/parcel-create-resolution.test.cjs test/sqlite-settlement-compat.test.cjs test/notification-service.test.cjs test/parcel-invitation-workflow.test.cjs test/network-entry-charge.test.cjs test/private-evidence-storage.test.cjs
